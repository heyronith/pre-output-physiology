name: Phase 25 Step 1 bootstrap

on:
  push:
    branches:
      - phase25/scenario-bank
    paths:
      - .github/workflows/phase25_step1_bootstrap.yml

permissions:
  contents: write

jobs:
  build-freeze-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and reconstruct frozen source bundle
        shell: bash
        run: |
          echo '0b6de0f4ffd4809b4a177b2cc881b0908333a1fd0699de41379e69c94da8c1cb  .phase25_bootstrap/part00' | sha256sum -c -
          echo '02689f3aa6b2d67b764d7c1e7e937033770216cee9ed0c1d31aa0ec6fe25aa91  .phase25_bootstrap/part01' | sha256sum -c -
          echo 'be06a9b48612e2c65b79b8b81361866e0a4119ebde989d8f6c257a13694fbff2  .phase25_bootstrap/part02' | sha256sum -c -
          echo '97a2f0d2d2075131309bc9bbd27a649464f4ff02dbfd1cec0ec0d1523e490ffe  .phase25_bootstrap/part03' | sha256sum -c -
          cat .phase25_bootstrap/part00 .phase25_bootstrap/part01 .phase25_bootstrap/part02 .phase25_bootstrap/part03 > /tmp/p25_source_bundle.b64
          echo '8e5738d6a5bc8e25bfeca974558487066cad97ea530045c38ed274ecf0437b78  /tmp/p25_source_bundle.b64' | sha256sum -c -
          base64 -d /tmp/p25_source_bundle.b64 > /tmp/p25_source_bundle.tgz
          echo 'eb42326a190e5716caef6e257c270c52a2a08289daf9e6c9694e0c0ed63964a5  /tmp/p25_source_bundle.tgz' | sha256sum -c -
          mkdir -p /tmp/p25src
          tar -xzf /tmp/p25_source_bundle.tgz -C /tmp/p25src
          cp -a /tmp/p25src/scripts/. scripts/
          cp -a /tmp/p25src/tests/. tests/

      - name: Generate candidate bank
        run: python scripts/generate_phase25_step1_scenario_bank.py --repo-root .

      - name: Restore frozen scientific audit artifacts
        shell: bash
        run: |
          mkdir -p artifacts/phase25_step1 reports
          cp /tmp/p25src/artifacts/phase25_step1/near_duplicate_report.json artifacts/phase25_step1/
          cp /tmp/p25src/artifacts/phase25_step1/scientific_content_audit.json artifacts/phase25_step1/
          cp /tmp/p25src/reports/phase25_step1_scenario_bank.md reports/phase25_step1_scenario_bank.md
          python scripts/finalize_phase25_step1_manifest.py --repo-root .

      - name: Validate candidate bank
        run: python scripts/validate_phase25_step1_scenario_bank.py --repo-root .

      - name: Run targeted tests
        shell: bash
        run: |
          python -m pip install -q pytest
          pytest -q tests/test_phase25_step1_scenario_bank.py

      - name: Freeze generated bank and remove bootstrap files
        shell: bash
        run: |
          rm -rf .phase25_bootstrap
          rm -f .github/workflows/phase25_step1_bootstrap.yml
          git config user.name 'phase25-step1-bot'
          git config user.email 'phase25-step1-bot@users.noreply.github.com'
          git add -A
          git commit -m 'data: freeze Phase 25 Step 1 scenario bank'
          git push origin HEAD:phase25/scenario-bank
