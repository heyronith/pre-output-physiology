name: Phase 25 Step 1 v2 bootstrap

on:
  push:
    branches:
      - phase25/scenario-bank-v2
    paths:
      - .github/workflows/phase25_step1_v2_bootstrap.yml

permissions:
  contents: write

jobs:
  build-freeze-bank-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify frozen source bundle
        shell: bash
        run: |
          cat .phase25_v2_bootstrap/part00 \
              .phase25_v2_bootstrap/part01 \
              .phase25_v2_bootstrap/part02 \
              .phase25_v2_bootstrap/part03 \
              .phase25_v2_bootstrap/part04 \
              .phase25_v2_bootstrap/part05 \
              .phase25_v2_bootstrap/part06 > /tmp/p25v2_source.b64
          echo 'b0861e2397a4245444c11ae81ad8fd7569873baa56e316c85790a32b03b7f140  /tmp/p25v2_source.b64' | sha256sum -c -
          base64 -d /tmp/p25v2_source.b64 > /tmp/p25v2_source.tgz
          echo 'fab540b67d6f928b16582ea319e534a99231b6b989d753912efaeced7555082b  /tmp/p25v2_source.tgz' | sha256sum -c -
          tar -xzf /tmp/p25v2_source.tgz -C .

      - name: Generate v2 candidate bank
        run: python scripts/generate_phase25_step1_v2.py --repo-root .

      - name: Validate v2 candidate bank
        run: python scripts/validate_phase25_step1_v2.py --repo-root .

      - name: Install test and lint tools
        run: python -m pip install -q pytest ruff

      - name: Run targeted tests
        run: pytest -q tests/test_phase25_step1_v2.py

      - name: Run Ruff
        run: ruff check scripts/generate_phase25_step1_v2.py scripts/validate_phase25_step1_v2.py scripts/finalize_phase25_step1_v2_manifest.py tests/test_phase25_step1_v2.py

      - name: Freeze manifest
        run: python scripts/finalize_phase25_step1_v2_manifest.py --repo-root .

      - name: Commit frozen v2 bank and remove bootstrap files
        shell: bash
        run: |
          rm -rf .phase25_v2_bootstrap
          rm -f .github/workflows/phase25_step1_v2_bootstrap.yml
          git config user.name 'phase25-step1-v2-bot'
          git config user.email 'phase25-step1-v2-bot@users.noreply.github.com'
          git add -A
          git commit -m 'data: freeze Phase 25 Step 1 v2 scenario bank'
          git push origin HEAD:phase25/scenario-bank-v2
