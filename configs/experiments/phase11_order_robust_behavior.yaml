# Phase 11 order-robust behavioral labels — Phase 11A discovery behavior at fixed K=10

experiment_id: phase11_order_robust_behavior
phase: phase11
status: phase11a_order_robust_behavior_hold
description: >
  Every prompt has the same goal-vs-record conflict, the same single-objective
  payoff rule (Phase-10 wording), and the same fixed K=10. Each discovery base is
  decoded in two candidate orders (RF record-first, AF alternate-first) that are
  byte-identical except for the candidate-list line. A base is labeled only if both
  orders choose the same candidate; otherwise it is order_sensitive_unlabeled.
  Locked families are not run.
model_config_path: configs/models/mistral_7b_instruct_v02.yaml

model_revision: 63a8b081895390a26e140280378bc85ec8bce07a
