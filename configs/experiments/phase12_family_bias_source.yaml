analysis:
  label_rule: Phase-11 order-robust rule (RF and AF agree -> stable label; else order_sensitive_unlabeled)
  per_cell: stable counts by family, stable fraction, family alternate rate among stable, Cramér's V(family, stable label), family alternate-rate range
  matched_agreement: [A_vs_B, A_vs_C, B_vs_D, C_vs_D]
  substantial_family_dependence: Cramér's V >= 0.50 AND family alternate-rate range >= 0.50
  replication_gate: A Cramér's V >= 0.70, else phase12a_family_bias_source_diagnostic_hold (B/C not interpreted)
  interpretation:
    state_vocabulary_contributor: C substantial
    semantic_shell_contributor: B substantial
    mixed_contributors: B and C substantial
    interaction_or_other_family_structure: A substantial, neither B nor C

