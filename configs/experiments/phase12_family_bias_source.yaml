# Phase 12 family-bias source diagnostic — Phase 12A (behavior only)

experiment_id: phase12_family_bias_source
phase: phase12
status: phase12a_family_bias_source_diagnostic_authorized
description: >
  Phase 11A order-stable labels were almost entirely family-determined (Cramér's V
  0.905). Phase 12A separates family semantic shell from family state vocabulary
  with a 2x2 prompt transformation (A FULL_FAMILY, B SEMANTIC_ONLY, C STATE_ONLY,
  D FULL_NEUTRAL) on 24 deterministic, label-independent Phase-11 bases per
  discovery family. Behavior-only confound diagnostic; not a deception experiment.
