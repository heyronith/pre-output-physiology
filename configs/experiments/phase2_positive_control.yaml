# Phase 2 positive-control experiment — authorized for execution on this branch.
experiment_id: phase2_positive_control_roleplay_deception
phase: phase2
status: authorized
description: >
  Validate instrumentation and measurement pipeline against RoleplayDeception,
  where Mistral-7B-Instruct-v0.2 has published activation-probe precedent.
  This does NOT establish spontaneous deceptive intent.

model_config_path: configs/models/mistral_7b_instruct_v02.yaml
dataset_config_path: configs/datasets/roleplay_deception.yaml
positive_control_dataset: RoleplayDeception

measurement_regimes:
  - positive_control_block12_mean_probe

instrumentation:
  transformer_block_index: 12
  hook_module_path: model.model.layers[12]
  aggregation: attention_mask_mean_non_padding
  store_dtype_after_aggregation: float32
  artifact_format: safetensors

probe:
  type: sklearn_logistic_regression
  C: 0.01
  fit_intercept: true
  normalize: true
  max_iter: 500
  random_state: 42

gpu:
  provider: modal
  gpu_type: L40S
  num_gpus: 1
  batch_size: 8
  soft_budget_usd: 20
  hard_budget_usd: 40

analysis:
  bootstrap_resamples: 2000
  bootstrap_seed: 0
  primary_metric: auroc

acceptance_gate:
  pass_min_auroc: 0.80
  investigate_min_auroc: 0.65

notes: >
  Exact dataset revision, Apollo source, and LASR code pins are in the dataset config.
  Phase 2 uses teacher-forced forward passes over fixed labelled outputs (D014).
  Collect only block-12 mean activations (D015). Fit probe locally (D016).
