# Phase 3 pre-output physiology scan — Phase 3B2 locked-test authorization

experiment_id: phase3_preoutput_physiology_scan
phase: phase3
status: phase3b2_locked_authorized
description: >
  Phase 3B1 canonical audit passed. Phase 3B2 one-shot locked-test evaluation
  authorized (train+val fit; untouched 500-row locked test). Regime C unauthorized.
  No causal interventions. Original 0.9999 gates not relaxed.
model_config_path: configs/models/mistral_7b_instruct_v02.yaml
dataset_config_path: configs/datasets/roleplay_deception.yaml
positive_control_dataset: RoleplayDeception

model_revision: 63a8b081895390a26e140280378bc85ec8bce07a
dataset_revision: bf93584916fbd23121eca6f2017017df0ef3184f
lasr_code_revision: f4c6ad69b10a5436a2e819c69009431802a0f5f7
apollo_revision: f8ec4010e74927394709dffa22b97bdf8cd5a62f

grouping:
  primary_key: prompt_sha256
  prompt_field: input_formatted
  diagnostic_key: id_prefix_before_underscore
  split_method: GroupShuffleSplit
  validation_fraction: 0.20
  random_state: 42
  locked_test: upstream_lasr_test_jsonl

measurement_regimes:
  - prompt_boundary_propensity  # k=0
  - early_trajectory_prediction  # fixed k>0
  - onset_aligned_pre_deceptive_output  # Regime C HOLD

coarse_scan:
  transformer_block_indices: [0, 4, 8, 12, 16, 20, 24, 28, 31]
  prefix_lengths_k: [0, 1, 2, 4, 8, 16]
  primary_anchor_layer: 12

primary_endpoints:
  regime_a:
    layer: 12
    k: 0
    interpretation: prompt_boundary_propensity
  regime_b:
    layer: 12
    k: 1
    interpretation: earliest_fixed_prefix_early_trajectory

eligibility:
  k0: all_rows
  k_gt_0: canonical_response_token_length_strictly_greater_than_k

canonical_extraction_mode: truncated_prefix
scientific_batch_size: 1
full_sequence_primary_authorized: false
original_preflight_gate_relaxed: false
compute_dtype: bfloat16
activation_storage_dtype: float32
surface_baseline_freeze_sha256: b25c5095c1cba440103343f90408c4caac0b59785bdc28b57a46abea405bcd00

activation_probe:
  type: sklearn_logistic_regression
  C: 0.01
  fit_intercept: true
  normalize: true
  max_iter: 500
  random_state: 42
  tune_C_per_cell: false

surface_baselines:
  majority: true
  prompt_text_only: true
  prompt_plus_prefix: true
  prefix_structural: true
  logit_summaries: phase3b1
  text_classifier:
    features:
      - word_tfidf_ngram_range: [1, 2]
      - char_tfidf_ngram_range: [3, 5]
    model: logistic_regression
    C_grid: [0.1, 1.0, 10.0]
    select_C_on: phase3_validation_only
    freeze_before_activations: true
    freeze_artifact: artifacts/phase3b_dev/surface_baseline_freeze.json
  structural_lr:
    C: 1.0
    random_state: 42
  logit_summary_lr:
    C: 1.0
    random_state: 42
  negative_controls:
    - shuffled_label_probe
    - random_activation_direction

statistics:
  primary_metric: auroc
  bootstrap_resamples: 2000
  bootstrap_unit: prompt_group
  paired_delta_auroc: activation_minus_surface

onset_annotation:
  activation_dependent: false
  llm_api_allowed: false
  high_confidence_rule: exact_substring_in_judge_explanation_and_model_output
  field_name: conservative_deceptive_sentence_onset
  unresolved_status: unresolved
  audit_seed: 42

phase3b_gpu:
  provider: modal
  gpu_type: L40S
  num_gpus: 1
  soft_budget_usd: 20
  hard_budget_usd: 40
  causal_mask_cosine_min: 0.9999
  batch_equivalence_cosine_min: 0.9999
  repeatability_cosine_min: 0.9999
  scientific_batch_size: 1
  authorized: true
  dev_gpu_authorized: true
  locked_test_gpu_authorized: true
  regime_c_authorized: false
  regime_c_status: hold_insufficient_onset_resolution
  full_sequence_primary_authorized: false

notes: >
  Phase 3B2 authorized after Phase 3B1 canonical audit. One-shot locked-test
  evaluation only; no tuning on locked test. Combined train+validation refit with
  frozen hyperparameters. Regime C HOLD. No causal interventions.
