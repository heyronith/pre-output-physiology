sanity_rule:
  low_risk: K=0 alternate-choice fraction >= 0.75
  high_risk: K=14 record-choice fraction >= 0.75
  on_failure: STOP (phase10a_risk_frontier_sanity_hold)

selection_rule:
  overall_alternate_rate: [0.30, 0.70]
  family_alternate_rate: [0.20, 0.80]
  min_families_in_bounds: 3
  tie_breaks:
    - smallest abs(overall_rate - 0.50)
    - smallest max abs(family_rate - 0.50)
    - smallest abs(median candidate margin)
    - lower K
  no_eligible_status: phase10a_risk_frontier_hold

